name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. Added because on 2026-08-26 neither this workflow nor its
  # sibling produced ANY run for PR #265 — zero runs created, both workflows
  # `active`, valid, correctly triggered on `pull_request: [main]`, while the
  # GitHub-managed CodeQL and Dependabot workflows kept running. With no
  # dispatch trigger anywhere in the repo there was no way to run the checks
  # at all, or to tell an environmental block from a trigger misfire.
  workflow_dispatch:

# Top-level default keeps the entire workflow read-only. Each job
# re-declares its own permissions so CodeQL
# (`actions/missing-workflow-permissions`) is satisfied per-job.
permissions:
  contents: read

# Job names below are the BARE names ("Build", "Lint", "Test",
# "Type Check", "Security Audit", "Registry Snapshot") because the
# org-wide branch-protection rule on `main` requires CI checks under
# their bare names. NB: this is the OPPOSITE convention from
# `.github/workflows/lint.yml`, which requires "lint / *" prefixed
# names. The asymmetry is intentional at the org level — see CLAUDE.md
# §14 "Org-wide required checks" for the authoritative table of
# required check names per workflow.

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --ignore-registry-errors keeps CI green when npmjs.org's audit
      # endpoint is degraded (the "quick" endpoint was retired in April 2026;
      # pnpm 10.x still calls it). Remove once pnpm ships a fix.
      - run: pnpm audit --audit-level=moderate --ignore-registry-errors

  registry:
    name: Registry Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs FIRST and unconditionally: it needs no credentials, so a missing
      # secret can never be the reason a component that breaks installs ships.
      # This is the gate that was impossible while source lived in a database
      # column — nothing could open a component, so nothing could check one.
      - name: Validate every registry item is installable
        run: pnpm registry:validate

      # `registry.json` is authored, not generated, so this no longer compares against
      # Supabase and no longer needs a credential — it asserts the committed file is in
      # canonical form so a diff shows what changed rather than a reordering.
      - name: Verify registry.json is canonical
        run: pnpm registry:verify

      # N1's tokens are the one thing 431 of 573 components depend on, and they reach a
      # consumer only as `cssVars` on the nyuchi-tokens item. That is generated from
      # app/globals.css, so this asserts the two have not drifted — a stale copy would
      # ship the wrong palette while every other gate stayed green.
      - name: Verify the theme tokens match app/globals.css
        run: pnpm tokens:registry:check

      # title / categories / docs / author are derived from data already on each item.
      # Checked rather than hand-maintained so 574 items cannot fall out of step one at
      # a time.
      - name: Verify registry item metadata is current
        run: pnpm registry:metadata:check

      # `files[].path` must be where the file IS in this repo and `files[].target` where it
      # GOES in the consumer's. They were merged into one field for the registry's whole
      # life — the install destination sat in `path` — which our own API hid, because it
      # resolves sources by component name and never reads `path`. `shadcn registry
      # validate nyuchi/mzizi` did not hide it: 574 of 574 items failed.
      - name: Verify registry source paths and install targets
        run: pnpm registry:paths:check

      # The extracted prop map is what lets a preview resolve sample data for a component
      # (§8.10). If it goes stale the previews silently degrade to empty — nothing errors,
      # they just stop showing anything, which is the failure mode this whole session has
      # been removing.
      - name: Verify the extracted component props are current
        run: pnpm props:verify

      # The six build-time artifacts that replaced request-time filesystem
      # reads. Each has a generator, a committed output and a `--check` that
      # fails when the two disagree.
      #
      # These were gated only in the deploy workflow, which is too late: a
      # stale artifact could merge and sit on `main` until someone deployed.
      # They cannot be checked in the `Build` job either — `prebuild` runs the
      # generators, so `pnpm build` silently regenerates what it was supposed
      # to be verifying, and passes. Here is the only place the committed file
      # is compared against its source before anything overwrites it.
      #
      # `Build` needs this job, so a failure here blocks the merge even though
      # `Registry Snapshot` is not itself in the required set (see #267).
      - name: Verify the generated artifacts match their sources
        run: |
          set -euo pipefail
          pnpm skills:generate:check
          pnpm doctrine:generate:check
          pnpm registry:index:check
          pnpm registry:source:check
          pnpm openapi:generate:check
          pnpm api:routes:check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The gate that makes the Rust half of the registry real.
    #
    # A `.rs` file under `components/registry/` with nothing compiling it is exactly what a
    # `source_code` database column was: bytes that no toolchain verifies. `mzizi-rs`
    # `#[path]`-includes those files, so `cargo check` here is a REGISTRY check, not just a
    # crate's own business — and it lands with the first Rust component rather than after
    # it, so there is never a window where Rust ships unchecked.
    #
    # `cargo test` runs the contract suite, which reads each component's `.tsx` sibling and
    # asserts the two agree on variants, `data-slot` names and classes. `cargo check` alone
    # cannot catch a Dioxus button that compiles perfectly and renders markup the shared
    # stylesheet does not style.
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mzizi-rs
      - name: Format
        run: cargo fmt --manifest-path mzizi-rs/Cargo.toml --all -- --check
      - name: Check
        run: cargo check --manifest-path mzizi-rs/Cargo.toml --workspace --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path mzizi-rs/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Contract tests against the TypeScript siblings
        run: cargo test --manifest-path mzizi-rs/Cargo.toml --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Format check
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,mjs,json,md,css,yaml,yml}" --ignore-path .prettierignore

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # Tests depend on the code being structurally sound — no point burning
    # runner minutes on `pnpm test` if eslint or tsc already failed.
    needs: [lint, typecheck]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    # Build is the terminal gate — runs only when every other CI job
    # has finished successfully. Order in `needs:` is: structural
    # (lint, typecheck) → behavioural (test) → integrity (audit,
    # registry). Adding a job above? Add it here too so build still
    # gates everything.
    needs: [audit, lint, typecheck, test, registry, rust]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
