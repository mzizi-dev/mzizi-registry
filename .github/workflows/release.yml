name: Release

# Releasing is a version bump merged to main; nobody pushes a tag by hand.
# When CI passes on main, this reads package.json's version and, if
# `v<version>` is not tagged yet, pushes that tag and creates a GitHub
# release. A merge that does not change the version finds its tag already
# there and does nothing, so a doc-only fix on an existing version is fine.
#
# Versioning policy (nyuchi/.github#80): a release to main is the next MINOR
# above the highest tag, and package.json must say so (the run fails and
# names the right version otherwise); merges into staging are tagged as
# patches by staging-version.yml; a MAJOR only by hand, from the Actions tab
# with bump: major. Each segment holds 0..999.
#
# The tag and release are made with RELEASE_BUMP_TOKEN (mzizi-dev org
# secret), not GITHUB_TOKEN: GitHub starts no workflow from a tag or release
# that GITHUB_TOKEN made, so anything that listens for `push: tags` or
# `release: published` would never run.
#
# This repo publishes nothing to npm and deploys no app (the portal was
# removed; mzizi.dev is mzizi-dev/mzizi-site), and every npm-distributed
# package moved to mzizi-dev/agent-tools, which publishes them from its own
# workflows (@nyuchi/mzizi-skills, @nyuchi/mzizi-cli). Do not re-add a
# publish step here: it would make two publishers for one package. Crates
# are published by publish-crates.yml.
#
# The lint, type check, tests and build that used to run inside this job
# are CI's jobs on the same commit; the tag waits for CI to pass.
#
# The tagging is nyuchi/.github's reusable-auto-tag.yml, called WITHOUT its
# `create-release` (its notes would be GitHub's merged-PR list). Release notes
# (owner, 2026-11-04: "Every release should have release notes too with a
# changelog") are this repo's own, in three jobs: `notes` builds them first and
# fails when CHANGELOG.md has no entry since the previous vX.Y.0 tag (nothing is
# tagged then); `release` tags; `publish` creates the GitHub release as a draft
# with the notes (.github/scripts/release_notes.py: every CHANGELOG.md entry
# added since the previous tag, plus a compare link) and publishes it once. A
# published release is never edited, so there is no later rewrite. `publish`
# acts only when the version's tag points at this commit, so a doc-only merge
# leaves the release alone.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Versioning policy override. main releases the next minor; a major
          is only ever made by hand, here.
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

jobs:
  notes:
    name: Release notes from CHANGELOG.md
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Trusted main; the released commit is only read as data, by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require changelog entries for this release
        env:
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse --verify "${SHA}^{commit}")"
          version="$(git show "${head}:package.json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "$tag is already tagged; nothing new to release."
            exit 0
          fi
          prev="$(git tag -l 'v*.*.0' --merged "$head" --sort=-v:refname | head -n 1 || true)"
          # Exits 1 when no CHANGELOG.md entry was added since the previous
          # release: the release fails here, before anything is tagged.
          python3 .github/scripts/release_notes.py "$prev" "$head" >/dev/null

  release:
    name: Auto-release on version bump
    needs: notes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    uses: nyuchi/.github/.github/workflows/reusable-auto-tag.yml@c2e2506a4eadf67fbf824b41720aa220c539fc21 # main, 2026-10-19
    with:
      version-command: node -p "require('./package.json').version"
      channel: main
      bump: ${{ inputs.bump || '' }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets:
      token: ${{ secrets.RELEASE_BUMP_TOKEN }}

  publish:
    name: GitHub release with the changelog notes
    needs: release
    if: >-
      needs.release.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the release as a draft and publish it once
        env:
          # The same token that pushed the tag, so the release can start other
          # workflows (GITHUB_TOKEN's cannot).
          GH_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # What the tag job pushed: it differs from package.json's version on
          # a manual run with a bump override.
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          head="$(git rev-parse --verify "${SHA}^{commit}")"
          tag="$TAG"
          if ! tagged="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")" || [ "$tagged" != "$head" ]; then
            echo "$tag is not on $head; no release to make."
            exit 0
          fi
          prev="$(git tag -l 'v*.*.0' --merged "$head" --sort=-v:refname | grep -Fvx "$tag" | head -n 1 || true)"
          if [ -n "$prev" ]; then
            compare="https://github.com/${GH_REPO}/compare/${prev}...${tag}"
          else
            compare="https://github.com/${GH_REPO}/commits/${tag}"
          fi
          CHANGELOG_URL="https://github.com/${GH_REPO}/blob/${tag}/CHANGELOG.md" COMPARE_URL="$compare" \
            python3 .github/scripts/release_notes.py "$prev" "$head" > "$RUNNER_TEMP/notes.md"
          bash .github/scripts/publish-release.sh "$tag" "$tag" "$RUNNER_TEMP/notes.md" latest
