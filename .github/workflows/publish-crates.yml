name: Publish crates

# Publishes the mzizi-rs crates (Mzizi Roots) to crates.io.
#
# Runs on every merge to main that touches the Rust, and on manual dispatch. A run
# that finds nothing new is a no-op: each crate's version is looked up on crates.io
# first, and a version that is already there is skipped. So a release is a version
# bump in mzizi-rs/Cargo.toml (`[workspace.package] version`, plus the `version =`
# on any path dependency between the crates), merged to main.
#
# A published version is permanent: it can be yanked but never re-uploaded. That is
# why this job runs the whole Rust gate again, on the exact commit it publishes,
# rather than trusting that CI passed on the pull request.
#
# The one secret it needs is CARGO_REGISTRY_TOKEN, a crates.io API token with the
# publish-new and publish-update scopes. A run that has something to publish and
# no token fails loudly; a run with nothing to publish does not need one.
#
# Once every crate is on crates.io at the workspace version, the run tags that
# version `mzizi-rs-vX.Y.Z` and creates a GitHub release for it, unless the tag
# already exists. That uses RELEASE_BUMP_TOKEN (mzizi-dev org secret), so the
# tag and release can start other workflows; nobody pushes a tag by hand.

on:
  push:
    branches: [main]
    paths:
      - "mzizi-rs/**"
      - "components/registry/**/*.rs"
      - ".github/workflows/publish-crates.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify every crate, but upload nothing"
        type: boolean
        default: true

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # No credential is kept: the build scripts of every dependency run in this
      # job. Only the tag step below gets RELEASE_BUMP_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The crates compile committed copies of the registry's .rs files. A copy that
      # has drifted from its source would publish a component the registry does not
      # serve. The generator has no npm dependencies, so no install is needed.
      - name: Verify the generated copies match the registry
        run: node scripts/generate-rust-components.mjs --check

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mzizi-rs

      - name: Format
        run: cargo fmt --manifest-path mzizi-rs/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path mzizi-rs/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Contract tests
        run: cargo test --manifest-path mzizi-rs/Cargo.toml --workspace

      - name: Package every crate
        run: cargo package --manifest-path mzizi-rs/Cargo.toml --workspace

      - name: Publish new versions in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          manifest=mzizi-rs/Cargo.toml
          agent="mzizi-registry publish-crates workflow (https://github.com/mzizi-dev/mzizi-registry)"

          # Dependencies first. mzizi-ui depends on mzizi-tokens; the other node crates stand
          # alone. The two umbrellas re-export node crates, so they go last.
          order=(
            mzizi-tokens mzizi-ui mzizi-brand mzizi-shell
            mzizi-assurance mzizi-fundi mzizi-docs mzizi-discovery
            mzizi-roots mzizi-roots-server
          )

          metadata=$(cargo metadata --manifest-path "$manifest" --no-deps --format-version 1)

          # The list must name every workspace member exactly once, so a new crate
          # cannot be merged and silently never published.
          members=$(jq -r '.packages[].name' <<<"$metadata" | sort)
          listed=$(printf '%s\n' "${order[@]}" | sort)
          if [ "$members" != "$listed" ]; then
            echo "::error::The publish order does not match the workspace members."
            echo "Workspace: $(tr '\n' ' ' <<<"$members")"
            echo "Order:     $(tr '\n' ' ' <<<"$listed")"
            exit 1
          fi

          # And it must put every crate after the workspace crates it depends on.
          position() { printf '%s\n' "${order[@]}" | grep -nx "$1" | cut -d: -f1; }
          for crate in "${order[@]}"; do
            for dep in $(jq -r --arg n "$crate" \
              '.packages[] | select(.name == $n) | .dependencies[] | select(.path != null) | .name' <<<"$metadata"); do
              if [ "$(position "$dep")" -ge "$(position "$crate")" ]; then
                echo "::error::$crate depends on $dep, which the publish order puts after it."
                exit 1
              fi
            done
          done

          for crate in "${order[@]}"; do
            version=$(jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version' <<<"$metadata")
            status=$(curl -sS -o /dev/null -w '%{http_code}' -A "$agent" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "$crate@$version is already on crates.io, skipping."
              continue
            fi
            if [ "$status" != "404" ]; then
              echo "::error::crates.io answered $status for $crate@$version; not publishing blind."
              exit 1
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: $crate@$version would be published."
              continue
            fi
            if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
              echo "::error::$crate@$version needs publishing and the CARGO_REGISTRY_TOKEN secret is not set."
              exit 1
            fi

            # crates.io limits how fast NEW crates can be created, so the first release
            # of all ten can hit 429. Wait and retry; a version that did land is found
            # by the lookup above on any re-run.
            for attempt in 1 2 3 4 5 6; do
              if out=$(cargo publish --manifest-path "$manifest" -p "$crate" --locked 2>&1); then
                echo "$out"
                echo "Published $crate@$version."
                break
              fi
              echo "$out"
              if grep -q "429" <<<"$out" && [ "$attempt" -lt 6 ]; then
                echo "Rate limited publishing $crate; waiting 11 minutes (attempt $attempt of 6)."
                sleep 660
                continue
              fi
              echo "::error::Publishing $crate@$version failed."
              exit 1
            done
          done

      # Every crate shares [workspace.package] version, so one tag names the set.
      - name: Tag and release the crates version
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --manifest-path mzizi-rs/Cargo.toml --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mzizi-roots") | .version')
          tag="mzizi-rs-v$version"
          if git ls-remote --tags --refs origin "refs/tags/$tag" | grep -q .; then
            echo "$tag already exists; nothing to tag."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_BUMP_TOKEN is not visible to this repository; cannot tag $tag."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Mzizi Roots crates $version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag"
          {
            echo "The Mzizi Roots crates at $version on crates.io:"
            echo
            crates=$(cargo metadata --manifest-path mzizi-rs/Cargo.toml --no-deps --format-version 1 \
              | jq -r '.packages[].name' | sort)
            for crate in $crates; do
              echo "- [\`$crate\` $version](https://crates.io/crates/$crate/$version)"
            done
            echo
            echo "Changes are in [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md)."
          } > notes.md
          gh release create "$tag" --verify-tag --title "Mzizi Roots crates $version" --notes-file notes.md --latest=false
