# MOVED: the org's Vite+ CI is nyuchi/.github's reusable-vite-plus.yml.
#
#   jobs:
#     vite-plus:
#       uses: nyuchi/.github/.github/workflows/reusable-vite-plus.yml@main
#
# This file used to hold the workflow, on the premise that nyuchi/.github
# could not be maintained by agent tooling. That premise is stale (see
# mzizi-dev/.github ORG_STANDARDS.md, gap 7): nyuchi/.github is now the one
# shared home for org CI, called cross-org, never forked. The successor keeps
# this file's contract (check / test / build, opt-in type checking, the
# migration order) and adds `fmt`, non-JS repos, advisory mode and setup-vp.
#
# What remains here is a thin pointer so a stray caller of the old path still
# runs the current workflow instead of failing to resolve. Nothing called it
# when it moved (2026-10-03). Its old inputs are gone, and because this is a
# nested call the contexts gain a level: `<caller> / vite-plus / check`.
# Call the nyuchi/.github file directly.

name: Reusable / Vite+ CI (moved)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  vite-plus:
    uses: nyuchi/.github/.github/workflows/reusable-vite-plus.yml@main
