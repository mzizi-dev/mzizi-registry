[package]
name = "mzizi-shell"
description = "Mzizi N7 shell for Dioxus — app chrome: bottom nav, footer, command palette, connectivity, theme, toasts, deep links and lifecycle."
# The description named the HEADER first, and this crate does not have one: `nyuchi-header`,
# `nyuchi-sidebar`, `app-switcher` and `nyuchi-root-layout` are the four of sixteen not
# ported. Same class of defect as `mzizi-tokens` describing five families of twenty-one —
# a manifest line that stopped being true and that nothing compares against the crate.
# crates.io renders `readme`, `keywords` and `categories` on the package page, and a
# published version is permanent — 0.1.0 can be yanked but never re-uploaded. All three
# were unset on this crate, so the page would have rendered bare.
#
# `categories` must be slugs from the crates.io list (https://crates.io/category_slugs);
# an invented one is rejected at publish time, after `cargo package` has already passed.
readme = "README.md"
keywords = ["dioxus", "app-shell", "navigation", "ui", "mzizi"]
categories = ["gui", "web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The contract suite does not ship. `cargo package` prints an "ignoring test
# contract" warning for this line; that is the intended outcome, not a defect to fix.
#
# `tests/contract.rs` reads each component's `.tsx`/`.ts` sibling out of
# `components/registry/` — three levels above this crate — and asserts the two agree.
# Those siblings are TypeScript and can never be in the tarball, so a published copy
# of this suite would panic on its first assertion for anyone who ran `cargo test` on
# a downloaded crate. The tests are a REGISTRY gate; CI runs them in the repo, where
# the files they read actually exist.
exclude = ["tests/"]

[lints]
workspace = true

[dependencies]
# Dioxus, for the components that render — matching mzizi-ui and mzizi-docs.
dioxus = { version = "0.7", default-features = false, features = ["macro", "signals", "hooks", "html"] }

# `regex`, and this is the one crate in the workspace that carries it.
#
# Every other crate here hand-rolls its parsing (N8's JSON, N11's JSON-LD) because the shape
# is small and fully specified. Deep-link route matching is not that: the .tsx uses native
# RegExp, named capture groups, and anchoring, and hand-writing a second regex engine to avoid
# one dependency would be the wrong trade — slower, more surface for a subtle bug, and no
# actual independence gained, since the .tsx's behaviour IS regex semantics. `regex` is
# std-only (no external C library, no build-time codegen surprises), which is why it is the
# one exception rather than the first of many.
regex = "1"
