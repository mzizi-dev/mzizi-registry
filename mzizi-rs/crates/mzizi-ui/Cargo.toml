[package]
name = "mzizi-ui"
description = "Mzizi N2 primitives for Dioxus: alert, avatar, badge, button, card, chart, input, label, a device code (RFC 8628 pairing, with a QR code), a safe markdown renderer, progress, separator, skeleton and status badge, the Rust path for the component registry."
# crates.io renders `readme`, `keywords` and `categories` on the package page, and a
# published version is permanent — 0.1.0 can be yanked but never re-uploaded. All three
# were unset on this crate, so the page would have rendered bare.
#
# `categories` must be slugs from the crates.io list (https://crates.io/category_slugs);
# an invented one is rejected at publish time, after `cargo package` has already passed.
readme = "README.md"
keywords = ["dioxus", "ui", "components", "design-system", "mzizi"]
categories = ["gui", "web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The contract suite does not ship. `cargo package` prints an "ignoring test
# contract" warning for this line; that is the intended outcome, not a defect to fix.
#
# `tests/contract.rs` reads each component's `.tsx`/`.ts` sibling out of
# `components/registry/` — three levels above this crate — and asserts the two agree.
# Those siblings are TypeScript and can never be in the tarball, so a published copy
# of this suite would panic on its first assertion for anyone who ran `cargo test` on
# a downloaded crate. The tests are a REGISTRY gate; CI runs them in the repo, where
# the files they read actually exist.
exclude = ["tests/"]

[lints]
workspace = true

[dependencies]
mzizi-tokens = { path = "../mzizi-tokens", version = "0.3.0" }
# A component LIBRARY, so no `launch`, no `devtools`, no renderer. Those belong to
# the app that mounts these primitives — pulling a renderer in here would pick the
# consumer's target for them, and Dioxus's whole point is that one codebase serves
# web, desktop, iOS and Android.
dioxus = { version = "0.7", default-features = false, features = ["macro", "signals", "hooks", "html"] }
# `device-code` draws its QR code on the device, never through a network service. The
# encoder only: default features off, so no `image`, `svg` or `pic` renderers come along
# (the component draws its own SVG), and the crate brings in no dependencies of its own.
qrcode = { version = "0.14", default-features = false }

# `device-code` reads the clock when the app passes no `now`. `std::time::SystemTime::now()`
# panics on wasm32-unknown-unknown, so there it reads the browser's clock instead.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"

[dev-dependencies]
# The contract suite renders components to HTML and evaluates their `CONTRACT` clauses
# against the markup (the shared evaluator in `mzizi-rs/contract-eval/`).
dioxus-ssr = "0.7"
# Reads `contracts/*.contract.json` in `tests/contracts_json.rs`.
serde_json = "1"
