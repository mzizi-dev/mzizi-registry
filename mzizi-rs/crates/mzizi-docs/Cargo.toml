[package]
name = "mzizi-docs"
description = "Mzizi N10 documentation — the self-describing rung: the system explaining itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The contract suite does not ship. `cargo package` prints an "ignoring test
# contract" warning for this line; that is the intended outcome, not a defect to fix.
#
# `tests/contract.rs` reads each component's `.tsx`/`.ts` sibling out of
# `components/registry/` — three levels above this crate — and asserts the two agree.
# Those siblings are TypeScript and can never be in the tarball, so a published copy
# of this suite would panic on its first assertion for anyone who ran `cargo test` on
# a downloaded crate. The tests are a REGISTRY gate; CI runs them in the repo, where
# the files they read actually exist.
exclude = ["tests/"]

[lints]
workspace = true

# Dioxus, and only for the two RENDERING components.
#
# `nyuchi-ai-context` and `nyuchi-docs-api` need nothing and get nothing — they are string
# assembly and routing. But N10 also ships a changelog timeline and a documentation portal,
# and a component that renders needs a renderer. The version matches `mzizi-ui`, so a
# consumer composing an N10 portal out of N2 primitives links one Dioxus.
[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "signals", "hooks", "html"] }
