[package]
name = "mzizi-roots"
description = "Mzizi Roots, the UI side: one dependency for Mzizi's Dioxus components and design tokens (mzizi-tokens, mzizi-ui, mzizi-brand, mzizi-shell), each behind a feature."
readme = "README.md"
keywords = ["dioxus", "ui", "components", "design-system", "mzizi"]
categories = ["gui", "web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

# An umbrella: no code of its own, only re-exports. The components live in the node crates,
# which stay the ones `/v1/rs/{name}` names; this crate is the one-line install.
[dependencies]
mzizi-tokens = { path = "../mzizi-tokens", version = "0.1.0" }
mzizi-ui = { path = "../mzizi-ui", version = "0.1.0", optional = true }
mzizi-brand = { path = "../mzizi-brand", version = "0.1.0", optional = true }
mzizi-shell = { path = "../mzizi-shell", version = "0.1.0", optional = true }

[features]
# Everything by default: the common case is an app that wants the whole design system.
# `default-features = false` plus the features you need trims it; `mzizi-tokens` is always in.
default = ["ui", "brand", "shell"]
# N2 primitives (Dioxus).
ui = ["dep:mzizi-ui"]
# N3 brand components (Dioxus).
brand = ["dep:mzizi-brand"]
# N7 app shell (Dioxus, plus `regex` for deep links).
shell = ["dep:mzizi-shell"]
