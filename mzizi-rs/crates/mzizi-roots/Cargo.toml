[package]
name = "mzizi-roots"
description = "Mzizi Roots, the UI side: the Dioxus-free element-tree runtime and its unstyled components, and one dependency for the Dioxus components still in mzizi-ui, mzizi-brand and mzizi-shell, each behind a feature."
readme = "README.md"
keywords = ["ui", "components", "design-system", "ssr", "mzizi"]
categories = ["gui", "web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

# The core (`node`, `components`) needs no dependency. The features below re-export the node
# crates' Dioxus components, which stay the ones `/v1/rs/{name}` names until they move here.
[dependencies]
# `markdown-renderer` shows a link's host the way the WHATWG URL parser serialises it (see the
# registry source). The same pin as `mzizi-ui` had.
url = "2.5.4"
mzizi-tokens = { path = "../mzizi-tokens", version = "0.7.0" }
mzizi-ui = { path = "../mzizi-ui", version = "0.7.0", optional = true }
mzizi-brand = { path = "../mzizi-brand", version = "0.7.0", optional = true }
mzizi-shell = { path = "../mzizi-shell", version = "0.7.0", optional = true }

[features]
# Everything by default: the common case is an app that wants the whole design system.
# `default-features = false` plus the features you need trims it; `mzizi-tokens` is always in.
default = ["ui", "brand", "shell"]
# N2 primitives (Dioxus).
ui = ["dep:mzizi-ui"]
# N3 brand components (Dioxus).
brand = ["dep:mzizi-brand"]
# N7 app shell (Dioxus, plus `regex` for deep links).
shell = ["dep:mzizi-shell"]

[dev-dependencies]
# Test-only: `tests/contracts.rs` includes the shared contract evaluator (`mzizi-rs/contract-eval/`),
# which renders Dioxus builds with `dioxus-ssr`. The core itself does not use Dioxus.
dioxus = { version = "0.7", default-features = false, features = ["macro", "html"] }
dioxus-ssr = "0.7"
serde_json = "1"
