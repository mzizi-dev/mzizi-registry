[package]
name = "mzizi-discovery"
description = "Mzizi N11 discovery — the machine-visibility rung: page metadata and Schema.org JSON-LD."
# crates.io renders `readme`, `keywords` and `categories` on the package page, and a
# published version is permanent — 0.1.0 can be yanked but never re-uploaded. All three
# were unset on this crate, so the page would have rendered bare.
#
# `categories` must be slugs from the crates.io list (https://crates.io/category_slugs);
# an invented one is rejected at publish time, after `cargo package` has already passed.
readme = "README.md"
keywords = ["seo", "schema-org", "json-ld", "metadata", "mzizi"]
categories = ["web-programming", "encoding"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

# No dependencies, matching N8 and N9.
#
# `serde_json` is the reflexive one and it is declined for the reason N8 states:
# these components compile into every consumer, and JSON-LD is a small, fully
# specified shape. The escaping this node needs is stricter than serde's default
# anyway — `<`, `>` and `&` must become \u escapes so a caller-supplied string
# cannot close the <script> element carrying it.
[dependencies]
