[package]
name = "mzizi-mongodb"
description = "Mzizi MongoDB: a read-only MongoDB client over the wire protocol (OP_MSG, SCRAM-SHA-256, a small BSON codec), sans-IO, for Cloudflare Workers."
readme = "README.md"
keywords = ["mongodb", "cloudflare-workers", "wasm", "bson", "mzizi"]
categories = ["database", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# The Cloudflare Workers host: a pooled connection over `mzizi-data`'s socket. wasm32 only.
workers = ["mzizi-data/workers", "dep:worker", "dep:js-sys"]

[dependencies]
mzizi-data = { path = "../mzizi-data", version = ">=0.6.0" }
mzizi-harness = { path = "../mzizi-harness", version = ">=0.6.0" }
serde_json = "1"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
subtle = "2.6"
hex = "0.4"
base64 = "0.22"
# Wipes the password and every key derived from it when they are dropped.
zeroize = "1.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
