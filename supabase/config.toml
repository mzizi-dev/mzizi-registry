# Supabase project configuration — history only.
#
# The registry holds no database. The Mzizi console (mzizi-dev/mzizi-console) is
# the only thing that talks to Supabase. This file stays so the SQL history in
# this directory keeps naming the project it was dumped from; it declares no
# edge functions (the `analytics` function that lived in supabase/functions/ was
# removed with the rest of the registry's Supabase code).

project_id = "grjsboqkaywpwatvrzmy"

[db]
major_version = 15

[db.migrations]
# We use a single-file schema dump at supabase/schema.sql instead of the
# versioned-migrations model. See supabase/README.md for the workflow.
enabled = false
